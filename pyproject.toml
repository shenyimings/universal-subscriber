[project]
name = "universal-subscriber"
version = "0.2.0"
description = "Watch feeds and pages, get an LLM-curated daily digest, and grow a personal knowledge wiki from what you read"
readme = "README.md"
authors = [
    { name = "“shenyimings”", email = "seuilping@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentmail>=0.5.6",
    "curl-cffi>=0.15.0",
    "feedparser>=6.0.12",
    "openai>=2.44.0",
    "pypdf>=5.1.0",
    "pyyaml>=6.0.3",
    "trafilatura>=2.1.0",
]

[project.scripts]
subscriber = "subscriber:main"

[tool.uv.build-backend]
module-name = "subscriber"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["subscriber"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"
